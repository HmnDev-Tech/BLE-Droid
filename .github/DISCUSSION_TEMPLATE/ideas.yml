name: Ideas
description: Rough idea or proposal that is not yet a feature request
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: One or two sentences. If it grows into a concrete workflow, open a feature request instead.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it would be useful
      description: What becomes possible that is not possible today.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched issues and discussions — this is not a duplicate
          required: true
        - label: This does not ask to bypass security or permissions
          required: true
