name: Build APK

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure signing
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "KEYSTORE_PASSWORD=$KS_PASS"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASS"
            } >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" \
              -storepass bledroid -keypass bledroid \
              -alias bledroid -keyalg RSA -keysize 2048 -validity 1 \
              -dname "CN=BLE-Droid CI, OU=CI, O=CI, L=CI, S=CI, C=US"
            {
              echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "KEYSTORE_PASSWORD=bledroid"
              echo "KEY_ALIAS=bledroid"
              echo "KEY_PASSWORD=bledroid"
            } >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect artifact
        run: |
          mkdir -p dist
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$apk" dist/BleDroid-release.apk
          sha256sum dist/BleDroid-release.apk > dist/SHA256SUMS

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BleDroid-APK
          path: dist/
          retention-days: 30
