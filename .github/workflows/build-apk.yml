name: Build APK

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure signing
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/shared.jks"
            {
              echo "KEYSTORE_PATH=$RUNNER_TEMP/shared.jks"
              echo "KEYSTORE_PASSWORD=$KS_PASS"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASS"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_B64 secret is not set - signing with a throwaway key. Artifacts from this run will NOT be updatable by future runs. Set KEYSTORE_B64/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD secrets for a stable signature."
            keytool -genkeypair -keystore "$RUNNER_TEMP/shared.jks" \
              -storepass bledroid -keypass bledroid \
              -alias bledroid -keyalg RSA -keysize 2048 -validity 1 \
              -dname "CN=BLE-Droid CI, OU=CI, O=CI, L=CI, S=CI, C=US"
            {
              echo "KEYSTORE_PATH=$RUNNER_TEMP/shared.jks"
              echo "KEYSTORE_PASSWORD=bledroid"
              echo "KEY_ALIAS=bledroid"
              echo "KEY_PASSWORD=bledroid"
            } >> "$GITHUB_ENV"
          fi

      - name: Build debug and release APK
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Collect artifacts
        run: |
          mkdir -p dist
          debug_apk=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          release_apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$debug_apk" dist/BleDroid-debug.apk
          cp "$release_apk" dist/BleDroid-release.apk
          sha256sum dist/BleDroid-debug.apk dist/BleDroid-release.apk > dist/SHA256SUMS

      - name: Verify debug and release share one signer
        run: |
          bt=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          apksigner="$ANDROID_HOME/build-tools/$bt/apksigner"
          debug_sig=$("$apksigner" verify --print-certs dist/BleDroid-debug.apk | awk '/SHA-256 digest/ {print $NF; exit}')
          release_sig=$("$apksigner" verify --print-certs dist/BleDroid-release.apk | awk '/SHA-256 digest/ {print $NF; exit}')
          echo "debug:   $debug_sig"
          echo "release: $release_sig"
          if [ -z "$debug_sig" ] || [ "$debug_sig" != "$release_sig" ]; then
            echo "::error::Debug and release APKs are not signed with the same certificate."
            exit 1
          fi
          echo "Signer matches."

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: BleDroid-APK
          path: dist/
          retention-days: 30
